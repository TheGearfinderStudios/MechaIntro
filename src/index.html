<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:"
		/>
		<title>MechaIntro</title>
		<link rel="stylesheet" href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css" />
		<link rel="stylesheet" href="styles/theme.css" />
		<link rel="stylesheet" href="styles/app.css" />
	</head>
	<body>
		<div id="app">
			<header class="titlebar" id="titlebar"></header>

			<div class="workspace">

			<section class="panel timeline-panel" id="timeline-panel"></section>

		<div id="modal-root"></div>
		<div id="toast-root"></div>

		<script type="module" src="js/main.js"></script>
